<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon logo WebP -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Mencegah pemblokiran CDN media TikTok (Bypass 403 Forbidden Referrer) -->
    <meta name="referrer" content="no-referrer" />
    
    <!-- Primary Meta Tags -->
    <title>TikDrop Vault Studio</title>
    <meta name="title" content="TikDrop Vault Studio" />
    <meta name="description" content="Aplikasi ekstraksi otomatis metadata dan media MP4 TikTok. Simpan, kelola, dan unduh koleksi video TikTok favorit Anda tanpa watermark ke dalam Vault pribadi dengan aman." />
    <meta name="keywords" content="TikDrop, TikTok downloader, Vault Studio, TikTok metadata extractor, save TikTok no watermark, manajemen video" />
    <meta name="theme-color" content="#18181b" /> <!-- Warna zinc-900 menyesuaikan tema aplikasi -->

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tikdrop.vercel.app/" /> <!-- Ganti dengan domain Vercel Anda jika ada -->
    <meta property="og:title" content="TikDrop Vault Studio" />
    <meta property="og:description" content="Simpan dan kelola koleksi video TikTok tanpa watermark dengan ekstraksi otomatis ke dalam Vault pribadi." />
    <meta property="og:image" content="/logo.webp" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
